<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-label="Diente Azul">
  <!-- One drawing, one stroke weight: the faceted tooth and the bind-rune are
       the same line, which is what makes them read as one figure rather than a
       badge with something inside it. The rune is the Hagall+Bjarkan bind the
       Bluetooth mark uses, and "Diente Azul" is that name in Spanish — the mark
       says the same thing the name does.
       Colour is literal, not currentColor: this file is loaded through <img>,
       where nothing is inherited. -->
