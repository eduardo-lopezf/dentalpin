    <path d="M32 17 22 11 14 21 17.5 34 23 51 27 52 30 37 32 35 34 37 37 52 41 51 46.5 34 50 21 42 11Z"/>
    <path d="M32 16V36"/>
    <path d="M32 16 42 22.5"/>
    <path d="M32 36 42 29.5"/>
  </g>
</svg>
