# The proxy of the replicas bench (docker-compose.yml beside this file).
# Two listeners, as a deployment has two hostnames: 8080 is the app, 8081
# the API.

# Docker's DNS. `resolve` makes nginx ask it again every 5 s, so a replica
# that is added, removed or restarted with a new address is picked up
# without reloading the proxy.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream frontend {
    zone frontend 64k;
    server frontend:3000 resolve;
}

upstream backend {
    zone backend 64k;
    server backend:8000 resolve;
}

proxy_http_version 1.1;
proxy_set_header Host              $http_host;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

server {
    listen 8080;
    # Which container answered.
    add_header X-Replica $upstream_addr always;

    location / {
        proxy_pass http://frontend;
    }
}

server {
    listen 8081;
    add_header X-Replica $upstream_addr always;

    # The API enforces its own upload limits and streams some of its
    # answers (copilot, recalls); the proxy stays out of both.
    client_max_body_size 0;
    proxy_buffering off;

    location / {
        proxy_pass http://backend;
    }
}
